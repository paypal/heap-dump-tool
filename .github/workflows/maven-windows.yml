# This workflow will build a Java project with Maven on Windows
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven Windows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        java: [ '8', '11', '17', '21', '25', '26' ]
    name: Java Windows ${{ matrix.Java }}
    steps:
      - uses: actions/checkout@v4
        with:
          # full history so spotless's ratchetFrom can resolve origin/main
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml
